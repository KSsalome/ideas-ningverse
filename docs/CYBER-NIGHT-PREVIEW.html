<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>白語寧的島｜群島夜色與未來王城</title><style>*{box-sizing:border-box}body{margin:0;background:#121b2c;color:#e8dec9;font:16px Georgia,serif;padding:24px}h1{font-size:28px;font-weight:400;letter-spacing:4px;margin:0 0 10px}p{line-height:1.8;color:#b9bdca}.grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;align-items:start}figure{margin:0 0 20px;border:1px solid #7c87a955;border-radius:12px;overflow:hidden;background:#18233a}img{width:100%;display:block}figcaption{padding:14px 18px;color:#d4d3dc;line-height:1.7}.phone img{max-width:390px;margin:auto}@media(max-width:700px){.grid{display:block}}</style><h1>群島一起入夜 · 主島未來王城</h1><p>臺北 17:00–23:00 · 共用星空、月光與薄霧，保留各島的建築語言。</p><div class="grid"><section><figure><img src="cyber-world-night-preview.jpg" alt="主島科技城堡與共享夜空的實際場景"><figcaption>主島：深藍與銀灰科技外牆、尖塔霓虹細線、全息裝置及藍紫能量噴泉。鄰近圖書館與神殿保留原本外觀。</figcaption></figure><figure><img src="cyber-library-night-preview.jpg" alt="圖書島在星空下保持英倫圖書館外觀"><figcaption>圖書島：維持墨綠板岩、象牙白石材與暖色窗光，使用同一片夜空。</figcaption></figure></section><figure class="phone"><img src="cyber-mobile-preview.jpg" alt="390px 寬度的主島科技夜景"><figcaption>390px 場景寬度。保留玩家取景與縮放，沒有因換景重新建立角色或世界。</figcaption></figure></div><p>以上為實際場景的 SVG 相容模式預覽。預覽環境沒有 WebGL，原生 GPU 光影與手機幀率仍待實機確認。截圖中的測試控制列不包含於正式網站。</p></html>
