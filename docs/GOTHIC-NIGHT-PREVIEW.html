<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>白語寧的島｜冷月古堡</title><style>*{box-sizing:border-box}body{margin:0;padding:26px;background:#0e1521;color:#e9dfcb;font:16px Georgia,serif}h1{font-weight:400;font-size:30px;letter-spacing:5px;margin:0 0 10px}p{color:#aeb9ca;line-height:1.8}.grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;align-items:start}figure{margin:0;border:1px solid #71809955;border-radius:12px;overflow:hidden;background:#182130}img{display:block;width:100%}figcaption{padding:16px;line-height:1.8;color:#d4d3dc}.phone img{max-width:390px;margin:auto}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><h1>冷月下的哥德古堡</h1><p>臺北 23:00–04:00 · 七島共享深夜與月光，只有主島更換建築風格。</p><section class="grid"><figure><img src="gothic-world-preview.jpg" alt="群島深夜與主島哥德古堡的實際場景"><figcaption>深灰石牆、黑色尖頂、暖色拱窗與少量暗紅玫瑰窗。圖書館、神殿、科技都市與礦山保留各自原本的外觀。</figcaption></figure><figure class="phone"><img src="gothic-mobile-preview.jpg" alt="390px 寬度的哥德主島實際場景"><figcaption>390px 寬度，保留原有取景、縮放與角色位置。主島庭園使用暗紅花叢、細長柏樹與低彩度綠植。</figcaption></figure></section><p>實際 3D 場景的 SVG 相容模式預覽。測試控制列不包含在正式網站；原生 WebGL 光影與手機幀率仍待實機驗證。</p></html>
