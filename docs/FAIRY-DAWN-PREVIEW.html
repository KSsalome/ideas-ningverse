<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夢幻仙境｜實際預覽</title><style>body{margin:0;background:#e5dfe7;color:#373549;font:16px/1.7 Georgia,serif;padding:5vw}h1{font-weight:500}p{max-width:72ch}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}figure{margin:24px 0}img{width:100%;display:block;border:1px solid #c8b9ca;border-radius:12px}figcaption{padding:9px 0;color:#696174}</style><h1>雲上庭園的四小時晨曦</h1><p>臺北時間 04:00–08:00，七座島共享粉紫、淺藍與奶油金晨光；僅主島切換象牙白宮殿、霧藍灰屋頂、淡粉旗幟與仙境花園。以下皆為實際 SVG 相容模式截圖，頂部控制列為已移除的本地驗證工具。</p><figure><img src="fairy-dawn-world-preview.jpg" alt="六點的仙境宮殿與群島"><figcaption>06:00｜清水噴泉、兩側花架與柔和晨曦。其他島保留原建築。</figcaption></figure><div class="grid"><figure><img src="fairy-dawn-0400-preview.jpg" alt="四點的粉紫晨曦"><figcaption>04:00｜上方保留粉紫夜色餘韻。</figcaption></figure><figure><img src="fairy-dawn-0759-preview.jpg" alt="接近八點時較明亮的天空"><figcaption>07:59｜天空逐步轉亮，奶油金天光與淡藍更明顯。</figcaption></figure></div><figure><img src="fairy-dawn-library-preview.jpg" alt="圖書島維持英倫建築並共享晨曦"><figcaption>圖書島｜墨綠屋頂、米白石牆、植物與原本路燈保留。</figcaption></figure><p>已通過 79 項自動測試。此預覽無 WebGL，手機原生 GPU 幀率仍待實機確認。</p></html>
