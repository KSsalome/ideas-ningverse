<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>白語寧的島｜皇家午光</title><style>*{box-sizing:border-box}body{margin:0;padding:26px;background:#e2e9eb;color:#273b4a;font:16px Georgia,serif}h1{font-weight:400;letter-spacing:5px;font-size:30px;margin:0 0 10px}p{line-height:1.8;color:#596976}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}figure{margin:0 0 20px;border:1px solid #8c9d9f;border-radius:12px;overflow:hidden;background:#edf0ed}img{display:block;width:100%}figcaption{padding:16px;line-height:1.8}details{padding:16px}summary{cursor:pointer}@media(max-width:700px){.grid{display:block}}</style><h1>陽光下的皇家城堡</h1><p>臺北 11:00–14:00 · 七島共享晴朗藍天與暖白日照，只有主島更換建築風格。</p><section class="grid"><figure><img src="royal-world-preview.jpg" alt="全島午光與皇家主島的實際場景"><figcaption>主島：奶油白石牆、藍灰瓦頂、皇家藍旗、香檳金徽章、整齊花園及清水噴泉。保留城堡量體、角色、道路與橋樑。</figcaption></figure><figure><img src="royal-library-preview.jpg" alt="圖書館保留原有外觀並共享相同藍天日照"><figcaption>圖書島維持米白外牆、墨綠屋頂、玻璃穹頂與原有植栽；全域天空不會在切換島嶼後隱藏。</figcaption></figure></section><details><summary>390px 寬度場景檢查</summary><img src="royal-mobile-preview.jpg" alt="瀏覽器內390px寬度的主島畫布"><p>畫面中央為 390px 寬度的實際場景畫布，保留取景與縮放操作。</p></details><p>以上為實際場景的 SVG 相容模式預覽。測試控制列不包含於正式網站。手機原生 WebGL 光影與幀率仍待實機確認。</p></html>
